<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My App - Post</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="styles.css" />
  <style>
  
  </style>
</head>
<body>

  <main>

    <h1 class="page-title">Post</h1>
    <p class="page-subtitle">Ask a question or share a quick update without adding a map pin.</p>

    <section class="post-form-section">
      <form id="postForm" class="post-form" onsubmit="event.preventDefault(); const text = this.postText.value.trim(); if (!text) { this.postText.focus(); return false; } const card = document.createElement('article'); card.className='post-card'; const message = document.createElement('p'); message.textContent = text; const time = document.createElement('time'); const now = new Date(); time.dateTime = now.toISOString(); time.textContent = new Intl.DateTimeFormat(navigator.language, { dateStyle: 'medium', timeStyle: 'short' }).format(now); card.append(message, time); const posts = document.getElementById('posts'); posts.prepend(card); const emptyState = document.getElementById('emptyState'); emptyState.hidden = posts.children.length > 0; this.postText.value = ''; this.postText.focus(); return false;">
        <label for="postText">Write your post</label>
        <textarea id="postText" name="postText" placeholder="Type your question or update here..." required></textarea>
        <button type="submit">Add post</button>
      </form>
    </section>

    <section class="post-feed" aria-live="polite">
      <h2 class="section-title">Recent posts</h2>
      <div id="posts"></div>
      <p id="emptyState" class="empty-state">No posts yet. Add one to get started.</p>
    </section>

  </main>

  <nav class="bottom-nav">
  
    <a href="index.html" class="nav-btn" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      Home
    </a>

    <a href="Chat.html" class="nav-btn" aria-label="Chat">

        <path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>
      </svg>
      Chat
    </a>


    <a href="Post.html" class="nav-btn active" aria-current="page" aria-label="Post">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5v14"/>
        <path d="M5 12h14"/>
      </svg>
      Post
    </a>

    <a href="Map.html" class="nav-btn" aria-label="Map">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6l7-3 7 3 7-3v15l-7 3-7-3-7 3V6z"/>

    <a href="Settings.html" class="nav-btn" aria-label="Settings">

      </svg>
      Settings

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
