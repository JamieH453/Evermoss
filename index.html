<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes it look correct on mobile screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Evermoss-Home</title>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4A5c40" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  
  <body class="darkmode">
    <header class="top-header" style="background:#4A5c40;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div class="profile" style="display:flex;align-items:center;gap:10px;">
        <div style="line-height:1">
          <div style="font-weight:600">Guest</div>
        </div>
      </div>
    </header>
  
  
    <main>
      <h1 class="page-title">Home</h1>
      <p class="page-subtitle">Welcome to Evermoss</p>
      <div class="cards-grid" style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px;">
        <div class="card">
          <h2>Weather</h2>
          <div id="weather-card" style="padding:16px;border-radius:16px;background:#f3f5eb;color:#2f4427;">
            <div id="weather-summary" style="font-size:1rem;font-weight:700;margin-bottom:0.75rem;">Loading weather...</div>
            <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;">
              <div style="font-size:2rem;font-weight:800;"> <span id="weather-temp">--</span> </div>
              <div style="font-size:0.95rem;line-height:1.4;">
                <div>Wind: <span id="weather-wind">--</span></div>
                <div>Direction: <span id="weather-direction">--</span></div>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <!-- Place this where you want the clock to appear -->
          <div id="datetime-display" style="display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;background:#f3f5eb;color:#2f4427;">
            <div id="date" style="font-size:1.05rem;font-weight:700;line-height:1.3;"></div>
            <div id="time" style="font-size:1.9rem;font-weight:800;line-height:1.1;"></div>
          </div>

<script>
  function updateDateTime() {
    const now = new Date();

    const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('date').textContent = now.toLocaleDateString('en-GB', dateOptions);

    // Format time: 14:35:09
    const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    document.getElementById('time').textContent = now.toLocaleTimeString('en-GB', timeOptions);
  }

  function updateWeatherUI(weather) {
    const conditions = {
      0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
      45:'Fog',48:'Depositing rime fog',51:'Light drizzle',53:'Moderate drizzle',55:'Dense drizzle',
      56:'Light freezing drizzle',57:'Dense freezing drizzle',61:'Slight rain',63:'Moderate rain',65:'Heavy rain',
      66:'Light freezing rain',67:'Heavy freezing rain',71:'Slight snow fall',73:'Moderate snow fall',75:'Heavy snow fall',
      77:'Snow grains',80:'Slight rain showers',81:'Moderate rain showers',82:'Violent rain showers',85:'Slight snow showers',86:'Heavy snow showers',
      95:'Thunderstorm',96:'Thunderstorm with slight hail',99:'Thunderstorm with heavy hail'
    };

    document.getElementById('weather-summary').textContent = conditions[weather.weathercode] || 'Current conditions';
    document.getElementById('weather-temp').textContent = `${weather.temperature.toFixed(1)}°C`;
    document.getElementById('weather-wind').textContent = `${weather.windspeed.toFixed(1)} km/h`;
    document.getElementById('weather-direction').textContent = `${Math.round(weather.winddirection)}°`;
  }

  async function fetchWeather(lat, lon) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=celsius&windspeed_unit=kmh&precipitation_unit=mm`;
    const response = await fetch(url);
    const data = await response.json();
    if (!data.current_weather) {
      throw new Error('Unable to load weather data');
    }
    updateWeatherUI(data.current_weather);
  }

  function loadFallbackWeather() {
    fetchWeather(54.7840, -1.5730).catch(() => {
      document.getElementById('weather-summary').textContent = 'Weather information unavailable';
    });
  }

  function updateDateTime() {
    const now = new Date();

    const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('date').textContent = now.toLocaleDateString('en-GB', dateOptions);

    // Format time: 14:35:09
    const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    document.getElementById('time').textContent = now.toLocaleTimeString('en-GB', timeOptions);
  }

  function loadWeather() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(position => {
        fetchWeather(position.coords.latitude, position.coords.longitude).catch(() => {
          loadFallbackWeather();
        });
      }, () => {
        loadFallbackWeather();
      }, { timeout: 10000 });
    } else {
      loadFallbackWeather();
    }
  }

  updateDateTime();
  setInterval(updateDateTime, 1000);
  loadWeather();
</script>
        </div>
        <!-- Messages card spanning full width -->
        <div class="card messages-card" style="grid-column:1 / -1; justify-self:center; max-width:480px; border:1px solid #d1d7c3; border-radius:18px; box-shadow:0 4px 14px rgba(0,0,0,0.08); background:#f9f9f4;">
          <h2>Messages</h2>
          <div id="messages-list" style="padding:12px;border-radius:12px;background:#f3f5eb;color:#2f4427;min-height:80px;">
            <p id="no-messages" style="opacity:0.7;margin:0">You have no messages.</p>
          </div>
        </div>
      </div>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav" aria-label="Main navigation">
      <!-- HOME -->
      <a href="Index.html" class="nav-btn active" aria-current="page" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <path d="M9 21V12h6v9"/>
        </svg>
        <span>Home</span>
      </a>
      <!-- CHAT -->
      <a href="Chat.html" class="nav-btn" aria-label="Chat">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Chat</span>
      </a>
      <!-- Button 3: POST -->
      <a href="Post.html" class="nav-btn" aria-label="Post">
        <!-- Post icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14"/>
          <path d="M5 12h14"/>
        </svg>
        <span>Post</span>
      </a>
      <!-- MAP -->
      <a href="Map.html" class="nav-btn" aria-label="Map">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6l7-3 7 3 7-3v15l-7 3-7-3-7 3V6z"/>
        </svg>
        <span>Map</span>
      </a>
      <!-- SETTINGS -->
      <a href="Settings.html" class="nav-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 8.6 15a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 8.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 15 8.6a1.65 1.65 0 0 0 1.82.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 15z"/>
        </svg>
        <span>Settings</span>
      </a>
    </nav>

    <!-- SERVICE WORKER -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Service Worker Registered'))
          .catch(error => console.error('Service Worker Error:', error));
      }
    </script>
  </body>
</html>
