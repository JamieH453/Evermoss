            <div id="date" style="font-size:1.05rem;font-weight:700;line-height:1.3;"></div>

          </div>

<script>
  function updateDateTime() {
    const now = new Date();

    const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('date').textContent = now.toLocaleDateString('en-GB', dateOptions);

    // Format time: 14:35:09
    const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    document.getElementById('time').textContent = now.toLocaleTimeString('en-GB', timeOptions);
  }

  updateDateTime();             
  setInterval(updateDateTime, 1000);  
</script>

<!-- Weather Display -->
<div id="weather-widget" style="font-family: monospace; text-align: center; padding: 20px;">
  <div id="weather-icon" style="font-size: 3rem;"></div>
  <div id="weather-temp" style="font-size: 2.5rem; font-weight: bold;"></div>
  <div id="weather-desc" style="font-size: 1rem; color: #888; margin-top: 6px;"></div>
  <div id="weather-location" style="font-size: 0.85rem; color: #aaa; margin-top: 4px;"></div>
  <div id="weather-status" style="font-size: 0.9rem; color: #aaa;">Fetching weather...</div>
</div>

<script>
  // Maps Open-Meteo weather codes to descriptions and emojis
  const weatherCodes = {
    0:  { desc: 'Clear sky',        icon: '☀️' },
    1:  { desc: 'Mainly clear',     icon: '🌤️' },
    2:  { desc: 'Partly cloudy',    icon: '⛅' },
    3:  { desc: 'Overcast',         icon: '☁️' },
    45: { desc: 'Foggy',            icon: '🌫️' },
    48: { desc: 'Icy fog',          icon: '🌫️' },
    51: { desc: 'Light drizzle',    icon: '🌦️' },
    53: { desc: 'Drizzle',          icon: '🌦️' },
    55: { desc: 'Heavy drizzle',    icon: '🌧️' },
    61: { desc: 'Light rain',       icon: '🌧️' },
    63: { desc: 'Rain',             icon: '🌧️' },
    65: { desc: 'Heavy rain',       icon: '🌧️' },
    71: { desc: 'Light snow',       icon: '🌨️' },
    73: { desc: 'Snow',             icon: '❄️' },
    75: { desc: 'Heavy snow',       icon: '❄️' },
    80: { desc: 'Rain showers',     icon: '🌦️' },
    95: { desc: 'Thunderstorm',     icon: '⛈️' },
  };

  async function getWeather() {
    const statusEl = document.getElementById('weather-status');

    // Step 1: Get user's coordinates
    if (!navigator.geolocation) {
      statusEl.textContent = 'Geolocation not supported by your browser.';
      return;
    }

    navigator.geolocation.getCurrentPosition(async (position) => {
      const { latitude, longitude } = position.coords;

      try {
        // Step 2: Fetch weather from Open-Meteo (no API key needed!)
        const weatherRes = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&temperature_unit=celsius`
        );
        const weatherData = await weatherRes.json();
        const current = weatherData.current;

        // Step 3: Fetch location name using reverse geocoding
        const geoRes = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`
        );
        const geoData = await geoRes.json();
        const city = geoData.address.city || geoData.address.town || geoData.address.village || 'Your location';
        const country = geoData.address.country_code?.toUpperCase() || '';

        // Step 4: Display the results
        const weather = weatherCodes[current.weather_code] || { desc: 'Unknown', icon: '🌡️' };

        document.getElementById('weather-status').style.display = 'none';
        document.getElementById('weather-icon').textContent = weather.icon;
        document.getElementById('weather-temp').textContent = `${Math.round(current.temperature_2m)}°C`;
        document.getElementById('weather-desc').textContent = weather.desc;
        document.getElementById('weather-location').textContent = `${city}, ${country}`;

      } catch (err) {
        statusEl.textContent = 'Could not load weather data.';
        console.error(err);
      }

    }, (err) => {
      statusEl.textContent = 'Location access denied. Please allow location in your browser.';
    });
  }

  getWeather();

  // Refresh weather every 10 minutes
  setInterval(getWeather, 10 * 60 * 1000);
</script>
