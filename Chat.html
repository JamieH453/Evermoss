<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Evermoss – Chat</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="styles.css" />
  <style>
  
  </style>
</head>
<body>

  <main>

    <div class="chat-app">
      <aside class="chat-list-panel">
        <div class="chat-list-header">
          <h1 class="page-title">Chats</h1>
          <button type="button" id="newChatBtn">New Chat</button>
        </div>
        <p class="page-subtitle">Open a conversation or start a new one.</p>
        <ul class="chat-list" id="chatList" aria-label="Recent chats">
          <li class="chat-item active" data-chat-id="1">
            <span class="chat-item-title">Evermoss Team</span>
            <span class="chat-item-preview">Hi! Welcome to Evermoss.</span>
          </li>
          <li class="chat-item" data-chat-id="2">
            <span class="chat-item-title">Alex</span>
            <span class="chat-item-preview">Want to meet later?</span>
          </li>
          <li class="chat-item" data-chat-id="3">
            <span class="chat-item-title">Jamie</span>
            <span class="chat-item-preview">Thanks for the update.</span>
          </li>
        </ul>
      </aside>

      <section class="chat-container" aria-label="Chat conversation">
        <div class="chat-header">
          <h2 id="chatTitle">Evermoss Team</h2>
          <p id="chatSubtitle">Send a message to the Evermoss team.</p>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <form class="chat-form" id="chatForm">
          <label for="messageInput" class="visually-hidden">Type your message</label>
          <input type="text" id="messageInput" name="message" placeholder="Type a message..." autocomplete="off" required />
          <button type="submit">Send</button>
        </form>
      </section>
    </div>

  </main>

 <!-- BOTTOM NAVIGATION BAR -->
  <!-- Students: change the labels and icons but keep the structure -->
  <nav class="bottom-nav" aria-label="Main navigation">
   <!-- Button 1: HOME (currently active — this is index.html) -->
    <a href="index.html" class="nav-btn"  aria-label="Home">
      <!-- Home icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      Home
    </a>

    <!-- Button 2: CHAT -->
    <a href="chat.html" class="nav-btn active" aria-current="page" aria-label="Chat">
      <!-- Chat icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>
      </svg>
      Chat
    </a>

    <!-- Button 3: POST -->
    <a href="post.html" class="nav-btn" aria-label="Post">
      <!-- Post icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5v14"/>
        <path d="M5 12h14"/>
      </svg>
      Post
    </a>

    <!-- Button 4: MAP -->
    <a href="map.html" class="nav-btn" aria-label="Map">
      <!-- Map icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6l7-3 7 3 7-3v15l-7 3-7-3-7 3V6z"/>
      </svg>
      Map
    </a>

    <!-- Button 5: SETTINGS -->
    <a href="settings.html" class="nav-btn" aria-label="Settings">
      <!-- Settings icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 8.6 15a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 8.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 15 8.6a1.65 1.65 0 0 0 1.82.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 15z"/>
      </svg>
      Settings
    </a>

  </nav>

  <script>
    // Start with no predefined chats so the user can add names themselves
    const chatData = {};

    let activeChatId = null;

    const chatList = document.getElementById('chatList');
    const chatMessages = document.getElementById('chatMessages');
    const chatTitle = document.getElementById('chatTitle');
    const chatSubtitle = document.getElementById('chatSubtitle');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const newChatBtn = document.getElementById('newChatBtn');

    function renderMessages() {
      chatMessages.innerHTML = '';
      const messages = chatData[activeChatId].messages;
      messages.forEach((message) => {
        const messageEl = document.createElement('div');
        messageEl.className = `message message-${message.sender}`;
        messageEl.textContent = message.text;
        chatMessages.appendChild(messageEl);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function updateChatHeader() {
      chatTitle.textContent = chatData[activeChatId].title;
      chatSubtitle.textContent = chatData[activeChatId].subtitle;
    }

    function setActiveChat(chatId) {
      activeChatId = chatId;
      const items = chatList.querySelectorAll('.chat-item');
      items.forEach((item) => {
        item.classList.toggle('active', item.dataset.chatId === chatId);
      });
      updateChatHeader();
      renderMessages();
    }

    function addMessage(text) {
      chatData[activeChatId].messages.push({ sender: 'me', text });
      updateChatPreview(activeChatId, text);
      renderMessages();
      messageInput.value = '';
      messageInput.focus();
      setTimeout(() => {
        const reply = 'Thanks! I got your message.';
        chatData[activeChatId].messages.push({ sender: 'other', text: reply });
        updateChatPreview(activeChatId, reply);
        renderMessages();
      }, 800);
    }

    function updateChatPreview(chatId, text) {
      const item = chatList.querySelector(`.chat-item[data-chat-id="${chatId}"]`);
      if (item) {
        const preview = item.querySelector('.chat-item-preview');
        preview.textContent = text;
      }
    }

    chatList.addEventListener('click', (event) => {
      const item = event.target.closest('.chat-item');
      if (!item) return;
      setActiveChat(item.dataset.chatId);
    });

    chatForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;
      addMessage(text);
    });

    newChatBtn.addEventListener('click', () => {
      const name = prompt('Enter a name for the new chat contact:');
      if (!name) return;
      const nextId = String(Object.keys(chatData).length + 1);
      chatData[nextId] = {
        title: name,
        subtitle: `Send a message to ${name}.`,
        messages: []
      };
      const listItem = document.createElement('li');
      listItem.className = 'chat-item';
      listItem.dataset.chatId = nextId;
      listItem.innerHTML = `<span class="chat-item-title">${name}</span><span class="chat-item-preview">New conversation</span>`;
      chatList.appendChild(listItem);
      setActiveChat(nextId);
      listItem.scrollIntoView();
    });

    if (activeChatId) setActiveChat(activeChatId);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

</body>
</html>
