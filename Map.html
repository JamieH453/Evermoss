<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Makes it look correct on mobile screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My App – map</title>

  <!-- PWA stuff -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Shared stylesheet -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Leaflet CSS for live map -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    .map-container {
      width: 100%;
      height: 500px;
      border-radius: 8px;
      overflow: hidden;
    }

    .map-controls {
      margin-top: 1rem;
      display: flex;
      justify-content: flex-end;
    }

    #add-pin-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      cursor: pointer;
      font: inherit;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
    }

    .modal.hidden {
      display: none;
    }

    .modal-content {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
    }

    .modal-content h2 {
      margin-top: 0;
    }

    .modal-content label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }

    .modal-content select,
    .modal-content textarea,
    .modal-content input {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 0.8rem;
      font: inherit;
    }

    .modal-content button[type="submit"] {
      width: 100%;
      margin-top: 1rem;
      padding: 0.85rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
    }

    .modal-content #form-close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #333;
    }

    .image-preview img {
      display: block;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 0.75rem;
    }

    .popup-post img {
      display: block;
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- MAIN CONTENT AREA -->
  <main>
    <h1 class="page-title">Map</h1>
    <p class="page-subtitle">Welcome to the Map page</p>
    <div id="map" class="map-container"></div>
    <div class="map-controls">
      <button id="add-pin-btn" type="button">Add post pin</button>
    </div>
  </main>
  <!-- END OF MAIN CONTENT AREA -->

  <div id="post-form-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <button id="form-close-btn" type="button" aria-label="Close form">&times;</button>
      <h2>Add a map post</h2>
      <form id="post-form">
        <label for="post-rating">Review rating</label>
        <select id="post-rating" required>
          <option value="">Select stars</option>
          <option value="1">1 star</option>
          <option value="2">2 stars</option>
          <option value="3">3 stars</option>
          <option value="4">4 stars</option>
          <option value="5">5 stars</option>
        </select>

        <label for="post-text">Text review</label>
        <textarea id="post-text" rows="4" placeholder="Write your review"></textarea>

        <label for="post-image">Image</label>
        <input id="post-image" type="file" accept="image/*" />
        <div id="image-preview" class="image-preview" aria-live="polite"></div>

        <button type="submit">Save pin</button>
      </form>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
    // Initialize the map
    const mapEl = document.getElementById('map');
    const map = L.map(mapEl).setView([54.7833, -1.5667], 13); // default to Durham area
    const addPinBtn = document.getElementById('add-pin-btn');
    const postFormModal = document.getElementById('post-form-modal');
    const postForm = document.getElementById('post-form');
    const formCloseBtn = document.getElementById('form-close-btn');
    const imageInput = document.getElementById('post-image');
    const imagePreview = document.getElementById('image-preview');

    let currentDraftMarker = null;
    let currentImageData = null;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function openPostForm() {
      postFormModal.classList.remove('hidden');
      postFormModal.setAttribute('aria-hidden', 'false');
    }

    function closePostForm() {
      postFormModal.classList.add('hidden');
      postFormModal.setAttribute('aria-hidden', 'true');
      postForm.reset();
      imagePreview.innerHTML = '';
      currentImageData = null;
    }

    function createPostPopupContent(rating, text, imageData) {
      const stars = '★'.repeat(rating) + '☆'.repeat(5 - rating);
      let html = '<div class="popup-post">';
      html += `<strong>${stars}</strong>`;
      if (text) {
        html += `<p>${text.replace(/\n/g, '<br>')}</p>`;
      }
      if (imageData) {
        html += `<img src="${imageData}" alt="Post image" />`;
      }
      html += '</div>';
      return html;
    }

    function addDraftMarker() {
      if (currentDraftMarker) {
        map.removeLayer(currentDraftMarker);
      }
      const center = map.getCenter();
      currentDraftMarker = L.marker(center, { draggable: true }).addTo(map);
      currentDraftMarker.bindPopup('Drag the pin to your desired location, then open the form to add a review.').openPopup();
      currentDraftMarker.on('click', () => openPostForm());
      currentDraftMarker.on('dragend', () => {
        currentDraftMarker.openPopup();
      });
      openPostForm();
    }

    addPinBtn.addEventListener('click', addDraftMarker);
    formCloseBtn.addEventListener('click', closePostForm);

    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (!file) {
        imagePreview.innerHTML = '';
        currentImageData = null;
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        currentImageData = reader.result;
        imagePreview.innerHTML = `<img src="${currentImageData}" alt="Selected image preview" />`;
      };
      reader.readAsDataURL(file);
    });

    postForm.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!currentDraftMarker) {
        return;
      }

      const rating = parseInt(document.getElementById('post-rating').value, 10) || 0;
      const text = document.getElementById('post-text').value.trim();
      const popupContent = createPostPopupContent(rating, text, currentImageData);

      currentDraftMarker.bindPopup(popupContent).openPopup();
      closePostForm();
    });

    // Try to use browser geolocation to center the map
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.setView([lat, lon], 15);
        L.marker([lat, lon]).addTo(map).bindPopup('You are here').openPopup();
      }, (err) => {
        // If geolocation fails, leave default view and add a sample marker
        L.marker([54.7833, -1.5667]).addTo(map).bindPopup('Durham (default)').openPopup();
      });
    } else {
      L.marker([54.7833, -1.5667]).addTo(map).bindPopup('Durham (default)').openPopup();
    }
  </script>

  <!-- Students: change the labels and icons but keep the structure -->
  <nav class="bottom-nav">
    <!-- Button 1: HOME (currently active — this is index.html) -->
    <a href="index.html" class="nav-btn" aria-label="Home">
      <!-- Home icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      Home
    </a>

    <!-- Button 2: CHAT -->
    <a href="chat.html" class="nav-btn" aria-label="Chat">
      <!-- Chat icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>
      </svg>
      Chat
    </a>

    <!-- Button 3: POST -->
    <a href="post.html" class="nav-btn" aria-label="Post">
      <!-- Post icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5v14"/>
        <path d="M5 12h14"/>
      </svg>
      Post
    </a>

    <!-- Button 4: MAP -->
    <a href="map.html" class="nav-btn" aria-current="page" aria-label="Map">
      <!-- Map icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6l7-3 7 3 7-3v15l-7 3-7-3-7 3V6z"/>
      </svg>
      Map
    </a>

    <!-- Button 5: SETTINGS -->
    <a href="settings.html" class="nav-btn" aria-label="Settings">
      <!-- Settings icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 8.6 15a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 8.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 15 8.6a1.65 1.65 0 0 0 1.82.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 15z"/>
      </svg>
      Settings
    </a>


  </nav>
  <!-- END NAVIGATION BAR -->

  <!-- Service worker registration (makes it a PWA) -->
  <script>
   if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const themeToggle = document.getElementById('toggle-dark-mode');
    const darkModeClass = 'dark-mode';

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.body.classList.add(darkModeClass);
        if (themeToggle) themeToggle.checked = true;
      } else {
        document.body.classList.remove(darkModeClass);
        if (themeToggle) themeToggle.checked = false;
      }
    }

    const savedTheme = localStorage.getItem('theme');
    applyTheme(savedTheme === 'dark' ? 'dark' : 'light');

    if (themeToggle) {
      themeToggle.addEventListener('change', () => {
        const selectedTheme = themeToggle.checked ? 'dark' : 'light';
        applyTheme(selectedTheme);
        localStorage.setItem('theme', selectedTheme);
      });
    }
  </script>

</body>
</html>
